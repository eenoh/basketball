services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8081
    container_name: frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - db
    container_name: backend

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: OOllEE2211
      MYSQL_DATABASE: referee
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    container_name: db

volumes:
  db_data:
